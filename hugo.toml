baseURL = "https://www.kyleengibous.com/"
title = "Kyle Engibous"
languageCode = "en-us"
defaultContentLanguage = "en"
enableRobotsTXT = true
capitalizeListTitles = false

# llms.txt — a Markdown index of the site for AI tools (https://llmstxt.org)
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "rss", "llms"]

[pagination]
  pagerSize = 20

[params]
  author = "Kyle Engibous"
  info = "Cloud Architect and DevOps enthusiast"
  description = "Kyle Engibous personal website"
  keywords = ["blog", "developer", "personal", "kubernetes", "devops"]
  avatar = "images/avatar.jpg"
  images = ["images/avatar.jpg"]
  since = 2019
  # Number of recent posts shown on the home page
  recentPosts = 5
  # Posts get a table of contents automatically when they have at least this
  # many headings and words. Override per post with `toc = true` / `toc = false`.
  tocMinHeadings = 3
  tocMinWords = 600

  # GoatCounter analytics (https://www.goatcounter.com) — set to your site code,
  # e.g. "kyleengibous" for kyleengibous.goatcounter.com. Empty = no analytics.
  # Only loads in production builds, so local previews aren't counted.
  goatcounter = "kyleengibous"

  # Comments via giscus (https://giscus.app), stored in this repo's GitHub
  # Discussions. Comments stay off until categoryId is set — get it from
  # giscus.app after enabling Discussions and installing the giscus app.
  [params.giscus]
    repo = "kengibous/engiblog"
    repoId = "MDEwOlJlcG9zaXRvcnkxODQxNjk0MzE="
    category = "Comments"
    categoryId = ""
    mapping = "pathname"

# Social links — `icon` is the name of an SVG in assets/icons/
[[params.social]]
  name = "GitHub"
  icon = "github"
  url = "https://github.com/kengibous/"
[[params.social]]
  name = "GitLab"
  icon = "gitlab"
  url = "https://gitlab.com/kengibous/"
[[params.social]]
  name = "X (Twitter)"
  icon = "twitter-x"
  url = "https://x.com/kengibous/"
[[params.social]]
  name = "LinkedIn"
  icon = "linkedin"
  url = "https://www.linkedin.com/in/kyle-engibous-b636b24/"
[[params.social]]
  name = "Facebook"
  icon = "facebook"
  url = "https://facebook.com/kyle.engibous"
[[params.social]]
  name = "Instagram"
  icon = "instagram"
  url = "https://instagram.com/kengibous"

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

[[menus.main]]
  name = "Blog"
  pageRef = "/posts"
  weight = 1
[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 2
[[menus.main]]
  name = "Contact"
  pageRef = "/contact"
  weight = 3

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
    ordered = false
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true

# "Updated" dates come only from a post's `lastmod` front matter, not git history
# (every post was re-committed during the 2023 Hugo move).
[frontmatter]
  lastmod = ["lastmod", "date"]

[sitemap]
  changeFreq = "monthly"
