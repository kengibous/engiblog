baseURL = "https://www.kyleengibous.com/"
title = "Kyle Engibous"
languageCode = "en-us"
defaultContentLanguage = "en"
enableRobotsTXT = true
capitalizeListTitles = false

# llms.txt — a Markdown index of the site for AI tools (https://llmstxt.org)
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "rss", "llms"]

[pagination]
  pagerSize = 20

[services.disqus]
  shortname = "kyleengibous"

[params]
  author = "Kyle Engibous"
  info = "Cloud Architect and DevOps enthusiast"
  description = "Kyle Engibous personal website"
  keywords = ["blog", "developer", "personal", "kubernetes", "devops"]
  avatar = "images/avatar.jpg"
  images = ["images/avatar.jpg"]
  since = 2019
  # Number of recent posts shown on the home page
  recentPosts = 5

# Social links — `icon` is the name of an SVG in assets/icons/
[[params.social]]
  name = "GitHub"
  icon = "github"
  url = "https://github.com/kengibous/"
[[params.social]]
  name = "GitLab"
  icon = "gitlab"
  url = "https://gitlab.com/kengibous/"
[[params.social]]
  name = "X (Twitter)"
  icon = "twitter-x"
  url = "https://x.com/kengibous/"
[[params.social]]
  name = "LinkedIn"
  icon = "linkedin"
  url = "https://www.linkedin.com/in/kyle-engibous-b636b24/"
[[params.social]]
  name = "Facebook"
  icon = "facebook"
  url = "https://facebook.com/kyle.engibous"
[[params.social]]
  name = "Instagram"
  icon = "instagram"
  url = "https://instagram.com/kengibous"

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

[[menus.main]]
  name = "Blog"
  pageRef = "/posts"
  weight = 1
[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 2
[[menus.main]]
  name = "Contact"
  pageRef = "/contact"
  weight = 3

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true

[sitemap]
  changeFreq = "monthly"
