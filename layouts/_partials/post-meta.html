<p class="post-meta">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>
  {{- if gt (.Lastmod.Sub .Date).Hours 24 }}
  <span aria-hidden="true">·</span>
  <span>Updated <time datetime="{{ .Lastmod.Format "2006-01-02" }}">{{ .Lastmod | time.Format ":date_long" }}</time></span>
  {{- end }}
  <span aria-hidden="true">·</span>
  <span>{{ .ReadingTime }} min read</span>
</p>
