<header class="site-header">
  <nav class="container nav" aria-label="Main">
    <a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <ul class="nav-links">
      {{- $current := . }}
      {{- range site.Menus.main }}
      {{- $active := or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }}
      <li><a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
      <li>
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
          <span class="theme-icon-light">{{ partial "icon.html" "sun-fill" }}</span>
          <span class="theme-icon-dark">{{ partial "icon.html" "moon-stars-fill" }}</span>
        </button>
      </li>
    </ul>
  </nav>
</header>
