<ul class="post-list">
  {{- range . }}
  <li class="post-item">
    <a class="post-link" href="{{ .RelPermalink }}">
      <h3 class="post-title">{{ .Title }}</h3>
      {{- with .Description }}<p class="post-desc">{{ . }}</p>{{ end }}
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_medium" }}</time>
    </a>
  </li>
  {{- end }}
</ul>
